<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Result Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .brand { font-family: 'Sora', sans-serif; }
        .bg-login {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input::placeholder { color: rgba(255,255,255,0.45); }
        .form-input:focus {
            border-color: rgba(147,197,253,0.7);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .toggle-pass { cursor: pointer; color: rgba(255,255,255,0.5); transition: color 0.2s; }
        .toggle-pass:hover { color: rgba(255,255,255,0.9); }
    </style>
</head>
<body>
<section class="bg-login flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/15 rounded-2xl mb-4 shadow-lg border border-white/20">
                <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
            </div>
            <h1 class="brand text-3xl font-bold text-white">Result Viewer</h1>
            <p class="text-blue-200 text-sm mt-1">Admin Portal</p>
        </div>

        <!-- Card -->
        <div class="glass rounded-3xl p-8 shadow-2xl">

            <h2 class="brand text-2xl font-bold text-white mb-1">Welcome back</h2>
            <p class="text-blue-200 text-sm mb-7">Sign in to your admin account</p>

            <!-- Alerts -->
            <div th:if="${param.logout}" class="bg-green-500/20 border border-green-400/40 text-green-200 text-sm px-4 py-3 rounded-xl mb-5 flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                You have been logged out successfully.
            </div>
            <div th:if="${param.error}" class="bg-red-500/20 border border-red-400/40 text-red-200 text-sm px-4 py-3 rounded-xl mb-5 flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Invalid username or password. Please try again.
            </div>

            <!-- Form -->
            <form th:action="@{'/do_login'}" method="post" class="space-y-5">

                <div>
                    <label class="block text-sm font-medium text-blue-100 mb-2">Username</label>
                    <input type="text" name="username" placeholder="Enter your username" class="form-input" autocomplete="username"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-blue-100 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="password" placeholder="Enter your password" class="form-input pr-12" autocomplete="current-password"/>
                        <button type="button" class="toggle-pass absolute right-4 top-1/2 -translate-y-1/2" onclick="togglePassword()">
                            <svg id="eye-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="w-full bg-white text-blue-800 font-bold py-3.5 rounded-2xl hover:bg-blue-50 transition duration-300 shadow-lg text-sm mt-2">
                    Sign In →
                </button>
            </form>

        </div>

        <p class="text-center text-blue-300/60 text-xs mt-6">© 2026 Result Viewer • Secure Admin Login</p>
    </div>
</section>

<script>
    function togglePassword() {
        const pass = document.getElementById('password');
        pass.type = pass.type === 'password' ? 'text' : 'password';
    }
</script>
</body>
</html>
