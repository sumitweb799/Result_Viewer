<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Result - Result Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .brand { font-family: 'Sora', sans-serif; }
        .bg-hero { background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%); min-height: 100vh; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px; font-size: 14px;
            color: #1e293b; background: #fff;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .form-input::placeholder { color: #94a3b8; }
        .nav-link { position: relative; padding-bottom: 2px; }
        .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: #3b82f6; transition: width 0.25s; }
        .nav-link:hover::after { width: 100%; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3">
        <div class="flex items-center justify-between">
            <a th:href="@{/}" href="#" class="brand text-xl font-bold text-blue-700 tracking-tight"> Result Viewer</a>
            <div class="hidden md:flex items-center gap-7">
                <a th:href="@{/}" href="#" class="nav-link text-gray-600 hover:text-blue-700 font-medium text-sm">Home</a>
                <a th:href="@{'/view_result'}" href="#" class="nav-link text-blue-700 font-semibold text-sm border-b-2 border-blue-700 pb-0.5">View Result</a>
                <a th:href="@{'/admin/add_result'}" href="#" class="nav-link text-gray-600 hover:text-blue-700 font-medium text-sm">Add Result</a>
                <a th:href="@{'/help'}" href="#" class="nav-link text-gray-600 hover:text-blue-700 font-medium text-sm">Help</a>
            </div>
            <button id="menu-btn" class="md:hidden text-gray-600 focus:outline-none">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden flex flex-col gap-3 mt-4 pb-4 border-t pt-4">
            <a th:href="@{/}" href="#" class="text-gray-600 text-sm font-medium">Home</a>
            <a th:href="@{'/view_result'}" href="#" class="text-blue-700 text-sm font-semibold">View Result</a>
            <a th:href="@{'/admin/add_result'}" href="#" class="text-gray-600 text-sm font-medium">Add Result</a>
            <a th:href="@{'/help'}" href="#" class="text-gray-600 text-sm font-medium">Help</a>
        </div>
    </div>
</nav>

<!-- FORM SECTION -->
<section class="bg-hero flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">

        <!-- Icon + Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-xl mb-4">
                <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
            </div>
            <h1 class="brand text-4xl font-bold text-gray-900 mb-2">Check Your Result</h1>
            <p class="text-gray-500 text-sm">Enter your Roll Number and Date of Birth to view your academic result.</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8">
            <form novalidate th:action="@{/view_result_action}" th:object="${requestResultForm}" method="post" class="space-y-5">

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Roll Number</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/>
                            </svg>
                        </span>
                        <input th:field="*{rollNumber}" type="text" placeholder="Enter your roll number" class="form-input pl-10"/>
                    </div>
                    <span class="text-red-500 text-xs mt-1 block" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></span>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Date of Birth</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </span>
                        <input th:field="*{dateOfBirth}" type="date" class="form-input pl-10"/>
                    </div>
                    <span class="text-red-500 text-xs mt-1 block" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition duration-300 mt-2">
                    View Result →
                </button>
            </form>

            <div class="mt-5 pt-5 border-t border-gray-100">
                <p class="text-center text-gray-400 text-xs">
                    Having trouble?
                    <a th:href="@{'/help'}" href="#" class="text-blue-600 hover:underline font-medium">Visit Help Center</a>
                </p>
            </div>
        </div>

        <p class="text-center text-gray-400 text-xs mt-5">Powered by Result Viewer</p>
    </div>
</section>

<script>
    document.getElementById('menu-btn').addEventListener('click', () => {
        document.getElementById('mobile-menu').classList.toggle('hidden');
    });
</script>
</body>
</html>
